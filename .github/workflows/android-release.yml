name: Android Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.1.0-alpha.1)"
        required: true

permissions:
  contents: read
  actions: write
  packages: write

jobs:
  build-android-release:
    name: Build Signed APK (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [phone, tablet, foldable, androidTv, fireTv]
        include:
          - profile: phone
            package-suffix: ""
          - profile: tablet
            package-suffix: "-tablet"
          - profile: foldable
            package-suffix: "-foldable"
          - profile: androidTv
            package-suffix: "-tv"
          - profile: fireTv
            package-suffix: "-firetv"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install root dependencies
        run: npm ci

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles(**/*.gradle*, **/gradle-wrapper.properties) }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode keystore
        run: |
          mkdir -p /tmp/secrets
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/secrets/release.keystore
          echo "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > /tmp/secrets/store-password.txt
          echo "${{ secrets.ANDROID_KEY_PASSWORD }}" > /tmp/secrets/key-password.txt
          echo "${{ secrets.ANDROID_KEY_ALIAS }}" > /tmp/secrets/key-alias.txt

      - name: Build signed APK (${{ matrix.profile }})
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/secrets/release.keystore \
            -Pandroid.injected.signing.store.password="$(cat /tmp/secrets/store-password.txt)" \
            -Pandroid.injected.signing.key.alias="$(cat /tmp/secrets/key-alias.txt)" \
            -Pandroid.injected.signing.key.password="$(cat /tmp/secrets/key-password.txt)"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Verify signed APK exists
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          APK_PATH="$APK_DIR/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Signed APK not found at $APK_PATH"
            exit 1
          fi
          echo "Signed APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Verify APK signature
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if command -v jarsigner &>/dev/null; then
            jarsigner -verify -verbose -certs "$APK_PATH" || true
          fi
          echo "APK signature check complete."

      - name: Generate SHA-256 checksum
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          sha256sum "$APK_PATH" > "$APK_PATH.sha256"
          echo "SHA-256 checksum:"
          cat "$APK_PATH.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: spartancode-release-${{ matrix.profile }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          retention-days: 30
          if-no-files-found: error

  verify-release:
    name: Verify Release Artifacts
    runs-on: ubuntu-latest
    needs: build-android-release
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -name "*.apk" | sort
          echo ""
          echo "Checksums:"
          find artifacts -type f -name "*.sha256" -exec echo "--- {} ---" \; -exec cat {} \;
      - name: Verify all profiles present
        run: |
          PROFILES="phone tablet foldable androidTv fireTv"
          for profile in $PROFILES; do
            APK=$(find artifacts -name "*.apk" -path "*release-$profile*" | head -1)
            if [ -z "$APK" ]; then
              echo "::error::Missing release APK for profile: $profile"
              exit 1
            fi
            echo "OK $profile: $APK"
          done
          echo "All 5 profiles verified."
      - name: Verify checksums
        run: |
          find artifacts -name "*.sha256" | while read sha_file; do
            APK=$(echo "$sha_file" | sed s/.sha256$//)
            if [ -f "$APK" ]; then
              cd "$(dirname "$sha_file")"
              sha256sum -c "$(basename "$sha_file")" || exit 1
              cd -
              echo "OK checksum verified: $sha_file"
            fi
          done
          echo "All checksums verified."

  sign-tag:
    name: Sign and Tag Release
    runs-on: ubuntu-latest
    needs: verify-release
    if: github.event_name == push && github.ref == refs/heads/main
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Determine tag
        id: tag
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "tag=v0.1.0-alpha.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create signed tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          git tag -u "Codex" -m "Release $TAG" "$TAG" || git tag -a -m "Release $TAG" "$TAG"
          git push origin "$TAG"
          echo "Signed tag created: $TAG"

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [sign-tag, build-android-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Determine tag
        id: tag
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "tag=v0.1.0-alpha.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          APK_FILES=$(find artifacts -name "*.apk" | sort)
          SHA_FILES=$(find artifacts -name "*.sha256" | sort)
          ASSETS=""
          for f in $APK_FILES $SHA_FILES; do
            ASSETS="$ASSETS $f"
          done
          gh release create "$TAG" \
            --title "SpartanCode Android $TAG" \
            --generate-notes \
            --prerelease \
            $ASSETS
          echo "GitHub release created: $TAG"
