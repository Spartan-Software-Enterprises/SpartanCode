name: SpartanCode verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  desktop-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - run: npm ci
      - run: xvfb-run -a npm run test:visual
        env:
          SPARTANCODE_VISUAL_OUTPUT: ${{ runner.temp }}/spartancode-visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-visual-evidence
          if-no-files-found: ignore
          path: ${{ runner.temp }}/spartancode-visual

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run format:check
      - run: node scripts/verify-matrix.js --output ../dist/android-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-verification
          path: dist/android-verification.json

  android-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;35.0.0"
      - run: npm ci
        working-directory: android
      - name: Start bounded API 30 emulator
        run: |
          set -euo pipefail
          export ANDROID_SDK_HOME="${HOME}/.spartancode-android-home"
          export ANDROID_AVD_HOME="${ANDROID_SDK_HOME}/avd"
          mkdir -p "$ANDROID_SDK_HOME" "$ANDROID_AVD_HOME"
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          timeout 900s sdkmanager "emulator" "system-images;android-30;google_apis;x86_64"
          echo no | avdmanager create avd \
            --name spartancode-ci \
            --package "system-images;android-30;google_apis;x86_64" \
            --device pixel_2 \
            --force
          # The hosted runner has about 5 GB free in its temp volume; the
          # default API 35 userdata image is larger than that. Keep the smoke
          # AVD bounded while leaving enough space for install and launch.
          for avd_config in \
            "$ANDROID_AVD_HOME/spartancode-ci.avd/config.ini" \
            "$ANDROID_AVD_HOME/spartancode-ci.avd/hardware-qemu.ini"; do
            touch "$avd_config"
            sed -i '/^disk\.dataPartition\.size=/d' "$avd_config"
            printf '%s\n' 'disk.dataPartition.size=2147483648' >> "$avd_config"
          done
          cd android
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon
          cd ../..
          # The APK is complete; reclaim disposable build/dependency caches so
          # the hosted runner can allocate the emulator userdata image.
          rm -rf android/node_modules "$HOME/.gradle/caches" "$HOME/.npm"
          timeout 900s "${ANDROID_HOME}/emulator/emulator" \
            -avd spartancode-ci \
            -partition-size 2048 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect \
            > "${RUNNER_TEMP}/spartancode-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() { kill "$emulator_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          adb start-server
          timeout 300s adb -s emulator-5554 wait-for-device || {
            adb devices -l || true
            cat "${RUNNER_TEMP}/spartancode-emulator.log" || true
            exit 1
          }
          for attempt in $(seq 1 180); do
            boot_completed="$(timeout 5s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            boot_animation="$(timeout 5s adb -s emulator-5554 shell getprop init.svc.bootanim 2>/dev/null | tr -d '\r' || true)"
            if [ "$boot_completed" = "1" ] || { [ "$boot_animation" = "stopped" ] && adb -s emulator-5554 shell pm path android >/dev/null 2>&1; }; then break; fi
            if [ "$attempt" -eq 180 ]; then
              cat "${RUNNER_TEMP}/spartancode-emulator.log"
              exit 1
            fi
            sleep 1
          done
          adb install -r android/android/app/build/outputs/apk/debug/app-debug.apk
          adb shell monkey -p com.spartansoftware.spartancode 1
          adb shell dumpsys package com.spartansoftware.spartancode | grep -q 'com.spartansoftware.spartancode'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-emulator-log
          if-no-files-found: ignore
          path: ${{ runner.temp }}/spartancode-emulator.log
