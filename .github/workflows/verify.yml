name: SpartanCode verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run format:check
      - run: node scripts/verify-matrix.js --output ../dist/android-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-verification
          path: dist/android-verification.json
