name: Feature request
description: Propose a user-facing SpartanCode improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What user workflow or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Describe the behavior, target client, and important constraints.
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Primary client
      options:
        - Desktop
        - Android
        - Both desktop and Android
        - MCP Bridge / integrations
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would demonstrate the feature works.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Scope checks
      options:
        - label: I have checked the roadmap and existing documentation.
          required: true
        - label: This request does not ask SpartanCode to bypass safety, privacy, or authorization controls.
          required: true
